<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{background:transparent;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:#f5f3ee}
.L{position:absolute;inset:0;display:none}
.H{font-family:"Inter Display";font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.panel{position:absolute;left:60px;right:60px;background:linear-gradient(180deg,#05080cee,#0b1118f2);border:2px solid #d5a62a;border-radius:22px;padding:38px 44px;box-shadow:0 18px 50px #000a}
.k{color:#efc650;font:800 26px Inter;letter-spacing:.3em}
.gold{color:#efc650}
</style></head><body>
<div class="L" id="brand"><div style="position:absolute;top:70px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:20px;background:#05080cd9;border:2px solid #d5a62a;border-radius:80px;padding:12px 34px 12px 12px;box-shadow:0 10px 30px #0008">
<img src="logo.png" style="width:96px;height:96px;border-radius:50%"><div><div class="H" style="font-size:46px;line-height:1">TicoTime <span class="gold">CR</span></div><div style="font:700 19px Inter;letter-spacing:.32em;color:#98a1ab;margin-top:6px">TU TIEMPO · TU ESTILO</div></div></div></div>

<div class="L" id="title"><div class="panel" style="bottom:250px"><div class="k" id="tK"></div><div class="H" id="tH" style="font-size:118px;line-height:.95;margin-top:14px;white-space:nowrap"><span id="t1"></span><br><span class="gold" id="t2"></span></div><div style="font:600 38px Inter;color:#d8dde2;margin-top:16px" id="tS"></div></div></div>

<div class="L" id="price"><div class="panel" style="bottom:250px"><div class="k" id="pK">PRECIO DE OFERTA</div><div style="display:flex;align-items:baseline;gap:30px;margin-top:12px;flex-wrap:wrap"><span id="pOld" style="font:700 54px Inter;color:#8e98a2;text-decoration:line-through;text-decoration-thickness:5px"></span><span class="H" id="pNew" style="font-size:150px;line-height:1;color:#ff5a4a"></span></div><div id="pSave" style="display:inline-block;margin-top:18px;background:#efc650;color:#080b0f;font:900 32px Inter;letter-spacing:.06em;padding:10px 18px"></div></div></div>

<div class="L" id="tag"><div style="position:absolute;left:0;top:0;width:260px;height:330px;display:flex;flex-direction:column;align-items:center">
<div style="width:5px;height:60px;background:#d5a62a"></div><div style="background:#d63a2f;border-radius:10px 10px 26px 26px;padding:34px 24px 24px;min-width:190px;text-align:center;box-shadow:0 14px 30px #000a;position:relative"><div style="position:absolute;top:13px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#05080c"></div><div class="H" id="gP" style="font-size:66px;line-height:1"></div><div style="font:900 24px Inter;letter-spacing:.14em;margin-top:6px">OFERTA</div></div></div></div>

<div class="L" id="perks"><div class="panel" style="bottom:250px"><div class="k">COMPRÁ CON CONFIANZA</div>
<div style="margin-top:20px;display:grid;gap:18px;font:800 50px Inter">
<div>✅ Garantía de <span class="gold">3 meses</span></div><div>✅ Sistema de <span class="gold">apartados</span></div><div>✅ Entrega <span class="gold">inmediata</span></div></div></div></div>

<div class="L" id="cta"><div class="panel" style="bottom:250px;text-align:center"><div class="k">PEDILO HOY</div>
<div style="margin:22px auto 0;display:inline-flex;align-items:center;gap:22px;background:#1f8f4e;border-radius:18px;padding:22px 40px">
<svg width="74" height="74" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.5.5 0 0 0 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
<span class="H" style="font-size:96px;line-height:1">8640-0835</span></div>
<div style="font:700 40px Inter;margin-top:24px">Mirá todos en <span class="gold">ticotimecr.com</span></div></div></div>
<script>
const f=n=>"₡"+String(n).replace(/\B(?=(\d{3})+(?!\d))/g,".");
window.setData=d=>{show("title");tK.textContent=d.brand.toUpperCase()+" · REF. "+d.ref;t1.textContent=d.t1;t2.textContent=d.t2;tS.textContent=d.sub;
 t1.style.display=t2.style.display="inline-block";let fs=118;tH.style.fontSize=fs+"px";while(Math.max(t1.offsetWidth,t2.offsetWidth)>860&&fs>60){fs-=4;tH.style.fontSize=fs+"px"}
 if(d.offer){pK.textContent="PRECIO DE OFERTA";pOld.style.display="";pOld.textContent=f(d.price);pNew.textContent=f(d.offer);pNew.style.color="#ff5a4a";pSave.style.display="inline-block";pSave.textContent="AHORRÁS "+f(d.price-d.offer);gP.textContent="-"+Math.round((1-d.offer/d.price)*100)+"%"}
 else{pK.textContent="PRECIO";pOld.style.display="none";pNew.textContent=f(d.price);pNew.style.color="#fff";pSave.style.display="inline-block";pSave.textContent="ENTREGA INMEDIATA · STOCK LIMITADO"}};
window.show=id=>{document.querySelectorAll('.L').forEach(e=>e.style.display=e.id===id?'block':'none')}</script>
</body></html>
