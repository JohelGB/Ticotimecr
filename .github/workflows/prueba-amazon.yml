name: Prueba Amazon
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in "https://www.amazon.com/s?k=invicta+watch+men&rh=p_89%3AInvicta" "https://www.amazon.com/s?k=casio+watch+women&rh=p_89%3ACasio&page=2"; do
            curl -s -o p.html -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -H "Accept: text/html,application/xhtml+xml" "$u"
            echo "$u size $(wc -c < p.html) results=$(grep -c 's-search-result' p.html) asins=$(grep -o 'data-asin="B0[A-Z0-9]*"' p.html | sort -u | wc -l) offs=$(grep -c 'a-offscreen' p.html) title=$(grep -o '<title>[^<]*' p.html)"
          done
