name: Buscar relojes en Amazon (para encargos)
on:
  push:
    paths: ['tools/amazon_buscar.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install beautifulsoup4
      - run: python3 tools/amazon_buscar.py
      - run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add tools/amazon_resultados.json
          git commit -m "Resultados de búsqueda en Amazon (Actions)" || exit 0
          git pull --rebase && git push
